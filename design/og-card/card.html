<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Mono:wght@500&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:linear-gradient(135deg,#f4ede0,#f6efdf 55%,#eee3cd);color:#5c1720;font-family:'Cormorant Garamond',Georgia,serif;position:relative}
  .frame{position:absolute;inset:14px;border:1px solid rgba(181,138,58,.45)}
  .frame:after{content:"";position:absolute;inset:8px;border:1px solid rgba(92,23,32,.10)}
  .photo{position:absolute;left:285px;top:0;width:630px;height:630px;background:url(faces-square.png) center/cover}
  .photo:before,.photo:after{content:"";position:absolute;top:0;bottom:0;width:1px;background:#ab843d}
  .photo:before{left:0}.photo:after{right:0}
  .side{position:absolute;top:0;bottom:0;width:285px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 24px;box-sizing:border-box}
  .left{left:0}.right{right:0}
  .kicker{font:500 13px/1.3 'DM Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#31533d}
  .names{font-weight:600;font-size:66px;line-height:.92;letter-spacing:-.03em;margin:22px 0 0}
  .amp{color:#ab843d;font-style:italic;font-weight:500;font-size:.7em}
  .rule{width:40px;height:2px;background:#ab843d;margin:26px auto}
  .note{font:italic 500 22px/1.35 'Cormorant Garamond',serif;color:#7b4a48}
  .date{font-weight:500;font-size:84px;line-height:.9;letter-spacing:-.04em}
  .month{font:500 14px/1.6 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;margin-top:12px}
</style></head>
<body>
  <div class="frame"></div>
  <div class="side left">
    <div class="kicker">Save the date</div>
    <div class="names">Ujjwal<br><span class="amp">&amp;</span><br>Apurva</div>
  </div>
  <div class="photo"></div>
  <div class="side right">
    <div class="date">28–30</div>
    <div class="month">November · 2026</div>
    <div class="rule"></div>
    <div class="note">With love from the<br>Jani &amp; Wanjari families</div>
  </div>
</body></html>
